name: Refresh interim report data

on:
  schedule:
    # 10:00 & 22:00 Beijing (UTC+8) during H1 disclosure season
    - cron: "0 2,14 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: Period to refresh from AKShare
        type: choice
        options:
          - h1
          - q1
          - both
        default: h1

concurrency:
  group: refresh-interim-data
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_data.txt

      - name: Install data dependencies
        run: pip install -r requirements_data.txt

      - name: Refresh interim data from AKShare
        id: refresh
        env:
          PERIOD: ${{ github.event.inputs.period || 'h1' }}
        run: |
          python scripts/refresh_interim_reports.py \
            --period "$PERIOD" \
            --write-summary

      - name: Create or update draft PR
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERIOD: ${{ github.event.inputs.period || 'h1' }}
          NEW: ${{ steps.refresh.outputs.new_disclosures }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="bot/refresh-interim-data"
          git checkout -B "$BRANCH"
          git add data.json
          git commit -m "feat(data): refresh ${PERIOD} interim data from AKShare"
          git push -f origin "$BRANCH"

          BODY=$(cat <<EOF
          Automated refresh from [\`refresh-interim-data\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          - **Period:** \`${PERIOD}\`
          - **New disclosures:** ${NEW:-none}
          - **Validate:** \`python validate_data.py\` passed in CI

          MCU rows still require \`mcu_known_data.json\` updates when semi-annual segment tables appear.
          EOF
          )

          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh pr comment "$EXISTING" --body "Updated: ${NEW:-no new disclosures} ($(date -u +%Y-%m-%dT%H:%MZ))"
          else
            gh pr create \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "feat(data): refresh interim reports from AKShare (${PERIOD})" \
              --body "$BODY"
          fi

      - name: No changes
        if: steps.refresh.outputs.changed != 'true'
        run: echo "No data.json changes — skip PR."
